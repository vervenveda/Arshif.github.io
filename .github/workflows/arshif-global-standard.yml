name: Arshif Global Standard
on:
  push:
    branches: [main]
    paths:
      - 'assets/arshif-global-standard-v1.js'
      - 'tools/arshif-global-standard-audit.mjs'
      - 'tools/semantic-hierarchy-audit.mjs'
      - 'tools/arshif-halls-header-audit.mjs'
      - 'tools/arshif-semantic-source-normalizer.mjs'
      - '.github/workflows/arshif-global-standard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Arshif global standard on every HTML page
        run: node tools/arshif-global-standard-audit.mjs --write
      - name: Verify Arshif global standard coverage
        run: node tools/arshif-global-standard-audit.mjs --check
      - name: Normalize Hall-local headers
        run: node tools/arshif-halls-header-audit.mjs --write
      - name: Verify one official page header per Hall
        run: node tools/arshif-halls-header-audit.mjs --check
      - name: Normalize clear Arshif semantic reversals in source
        run: node tools/arshif-semantic-source-normalizer.mjs --write
      - name: Verify no clear Arshif semantic reversals remain in source
        run: node tools/arshif-semantic-source-normalizer.mjs --check
      - name: Audit Arshif semantic hierarchy
        run: node tools/semantic-hierarchy-audit.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Arshif pages required repair."
            exit 0
          fi
          git config user.name "Verve N Veda Automation"
          git config user.email "vervenveda@users.noreply.github.com"
          git add -A -- ':!node_modules' ':!.git'
          git commit -m "Standardize Arshif archive chrome typography and hierarchy"
          git push
